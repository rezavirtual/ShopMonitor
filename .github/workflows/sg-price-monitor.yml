name: Singapore Price & Voucher Monitor

on:
  schedule:
    # Run automatically every 4 hours (UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      item_id:
        description: 'Optional specific item ID to check (leave empty for all active items)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sg-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium browser
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run SG Price & Voucher Monitor
        env:
          ITEM_ID: ${{ github.event.inputs.item_id }}
          SHOPEE_COOKIES_JSON: ${{ secrets.SHOPEE_COOKIES_JSON }}
          LAZADA_COOKIES_JSON: ${{ secrets.LAZADA_COOKIES_JSON }}
          AMAZON_COOKIES_JSON: ${{ secrets.AMAZON_COOKIES_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m scraper.main

      - name: Commit and push updated watchlist.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/watchlist.json; then
            echo "No changes to data/watchlist.json"
            exit 0
          fi
          git add data/watchlist.json
          git commit -m "chore: update SG price & voucher watchlist [skip ci]"
          git pull --rebase origin main
          git push origin main
